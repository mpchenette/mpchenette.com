<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mpchenette</title>
  <style>
    @font-face {
      font-family: 'matthew';
      src: url('Matthew-Regular.ttf');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1rem;
      font-family: 'matthew', sans-serif;
      font-size: 1.5rem;
      line-height: 1.6;
      color: #222;
    }

    h1 { margin-bottom: 0.25rem; }

    .tagline {
      color: #666;
      margin-bottom: 2rem;
    }

    section { margin-bottom: 1.5rem; }

    h1, h2, p, li, a { text-transform: lowercase; }

    h2 {
      font-size: 1rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    ul { list-style: disc; padding-left: 1.25rem; }

    li { margin-bottom: 0.25rem; }

    a { color: #222; }
  </style>
</head>
<body>
  <h1>matthew chenette</h1>
  <p class="tagline">senior customer success architect @ github</p>

  <section>
    <h2>Projects</h2>
    <ul>
      <li><a href="#">Project One</a> — short description</li>
      <li><a href="#">Project Two</a> — short description</li>
    </ul>
  </section>

  <section>
    <h2>Articles</h2>
    <ul>
      <li><a href="#">Article Title</a></li>
      <li><a href="#">Another Article</a></li>
    </ul>
  </section>

  <section>
    <h2>Links</h2>
    <ul>
      <li><a href="#">GitHub</a></li>
      <li><a href="#">LinkedIn</a></li>
    </ul>
  </section>
</body>
</html>
